{% extends "base.html" %}

{% block title %}Confirm Deletion{% endblock %}

{% block extra_css %}
<style>
    /* Security confirmation modal-like card */
    .delete-card {
        border: none;
        border-radius: 16px;
        background-color: #ffffff;
    }
    .warning-icon-wrapper {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
    }
    .comment-preview-box {
        background-color: #f8f9fa;
        border-left: 4px solid #dee2e6;
        border-radius: 4px;
        font-style: italic;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5">

        <!-- Main Deletion Card Wrapper -->
        <div class="card shadow-sm delete-card overflow-hidden">
            <!-- Top brand warning accent line -->
            <div class="bg-danger" style="height: 4px;"></div>

            <div class="card-body p-4 p-md-5 text-center">
                <!-- Warning Graphic Badge -->
                <div class="warning-icon-wrapper bg-danger bg-opacity-10 text-danger mb-4">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>

                <h2 class="h4 fw-bold text-dark mb-2">Delete Comment</h2>
                <p class="text-muted small mb-4">Are you sure you want to permanently remove this log notation from the record?</p>

                <!-- Comment Resource Content Preview Block -->
                <div class="comment-preview-box p-3 text-start text-dark-emphasis small mb-4">
                    "{{ comment.content }}"
                </div>

                <!-- Core Form Actions Element -->
                <form method="post" autocomplete="off">
                    {% csrf_token %}

                    <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center align-items-center border-top pt-4">
                        <!-- Navigation Cancel Dismiss Action Button -->
                        <a href="{% if user.role == 'Patient' %}{% url 'patients:my_record' %}{% else %}{% url 'patients:record_list' %}?hospital_id={{ user.hospital.id }}{% endif %}" class="btn btn-light border px-4 py-2 w-100 w-sm-auto order-2 order-sm-1 text-secondary fw-medium">
                            Cancel
                        </a>

                        <!-- Destructive Trigger Execution Button -->
                        <button type="submit" class="btn btn-danger px-4 py-2 w-100 w-sm-auto order-1 order-sm-2 fw-medium d-inline-flex align-items-center justify-content-center gap-2">
                            <i class="fa-solid fa-trash-can small"></i>
                            <span>Yes, Delete Comment</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
